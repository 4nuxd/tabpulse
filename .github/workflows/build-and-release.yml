name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure git tag exists
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Build browser packages
        run: |
          ./scripts/package-extension.sh chrome
          ./scripts/package-extension.sh edge
          ./scripts/package-extension.sh firefox
          ./scripts/validate-firefox-package.sh

          mv "dist/tabpulse-chrome.zip" "tabpulse-v${{ steps.version.outputs.version }}-chrome.zip"
          mv "dist/tabpulse-edge.zip" "tabpulse-v${{ steps.version.outputs.version }}-edge.zip"
          mv "dist/tabpulse-firefox.zip" "tabpulse-v${{ steps.version.outputs.version }}-firefox.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            tabpulse-v${{ steps.version.outputs.version }}-chrome.zip
            tabpulse-v${{ steps.version.outputs.version }}-edge.zip
            tabpulse-v${{ steps.version.outputs.version }}-firefox.zip
          generate_release_notes: true
