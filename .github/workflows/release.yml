name: Package Extension

# Runs automatically whenever you push a version tag like v1.0, v1.1, v2.0 ...
on:
  push:
    tags:
      - "v*"
  # Lets you also trigger it manually from the "Actions" tab on GitHub
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build browser packages
        run: |
          ./scripts/package-extension.sh chrome
          ./scripts/package-extension.sh edge
          ./scripts/package-extension.sh firefox
          ./scripts/validate-firefox-package.sh

          mv "dist/tabpulse-chrome.zip" "tabpulse-v${{ steps.version.outputs.version }}-chrome.zip"
          mv "dist/tabpulse-edge.zip" "tabpulse-v${{ steps.version.outputs.version }}-edge.zip"
          mv "dist/tabpulse-firefox.zip" "tabpulse-v${{ steps.version.outputs.version }}-firefox.zip"

      - name: Create GitHub Release with the zip attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            tabpulse-v${{ steps.version.outputs.version }}-chrome.zip
            tabpulse-v${{ steps.version.outputs.version }}-edge.zip
            tabpulse-v${{ steps.version.outputs.version }}-firefox.zip
          generate_release_notes: true
